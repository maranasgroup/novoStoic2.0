[project]
authors = [{name = "Frames White", email = "me@oxinabox.net"}]
description = "Add a short description here"
name = "novoStoic2.0"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge", "main", "r", "msys2"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
novostoic2_0 = { path = ".", editable = true }
pulp = ">=3.0.2,<4"


[tool.pixi.dependencies]
rdkit = { version = "==2023.3.3" }
tensorflow = "==2.14.0"
streamlit = "==1.28.0"
pandas = { version = "==2.1.1" }
keras = "==2.14.0"
scikit-learn = "==1.3.1"
matplotlib-base = { version = "==3.8.0" }
openbabel = { version = "==3.1.1" }
ipython = ">=9.0.0,<10"
highspy = ">=1.9.0,<2"
